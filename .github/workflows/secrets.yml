name: Secrets and Token
on: workflow_dispatch
permissions:
  contents: read
jobs:
  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Use secret safely
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Secret is: $MY_SECRET"
          echo "Length: ${#MY_SECRET}"
      - name: REST API call with GITHUB_TOKEN
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }} | grep -m1 '"full_name"'
      - name: Checkout using GITHUB_TOKEN
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Git operation
        run: |
          git ls-remote origin HEAD
          git log -1 --oneline
