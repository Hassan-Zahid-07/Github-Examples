name: Context and Conditionals
on: workflow_dispatch
env:
  WORKFLOW_LEVEL: "workflow-env"
jobs:
  context-demo:
    runs-on: ubuntu-latest
    env:
      JOB_LEVEL: "job-env"
    steps:
      - uses: actions/checkout@v4
      - name: Print contexts
        env:
          STEP_LEVEL: "step-env"
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Var: ${{ vars.MY_VAR }}"
          echo "env context: ${{ env.JOB_LEVEL }}"
          echo "Levels: $WORKFLOW_LEVEL / $JOB_LEVEL / $STEP_LEVEL"
          echo "Default vars: $GITHUB_REPOSITORY / $GITHUB_ACTOR"
      - name: Set env var with workflow command
        run: echo "MY_VAL=hello" >> "$GITHUB_ENV"
      - name: Read it in the next step
        run: echo "MY_VAL is $MY_VAL"
      - name: contains demo
        if: contains(github.event_name, 'dispatch')
        run: echo "contains() matched"
      - name: success demo
        if: success()
        run: echo "success() true"
      - name: failure demo
        if: failure()
        run: echo "only runs on failure"
      - name: always demo
        if: always()
        run: echo "always() runs"
